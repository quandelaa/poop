[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "poop-project"
version = "1.0.8"
description = "CLI tool to organize your messy files"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
"rich"
]

[tool.setuptools]
packages  = ["poop_project"]

[project.scripts]
poop = "poop_project.main:main"
